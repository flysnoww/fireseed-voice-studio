name: Audit rejected TestFlight IPA

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Existing TestFlight workflow run that created the IPA
        required: true
        default: "36509813896"
        type: string

permissions:
  actions: read
  contents: read

jobs:
  audit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: VoiceStudio-TestFlight-IPA
          run-id: ${{ github.event.inputs.source_run_id || '36509813896' }}
          github-token: ${{ github.token }}
          path: rejected-build
      - name: Extract and audit original signed IPA
        run: |
          set -euo pipefail
          IPA="$PWD/rejected-build/VoiceStudio-TestFlight.ipa"
          test -s "$IPA"
          mkdir "$RUNNER_TEMP/rejected-ipa"
          ditto -x -k "$IPA" "$RUNNER_TEMP/rejected-ipa"
          APP=$(find "$RUNNER_TEMP/rejected-ipa/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$APP"
          python3 scripts/inspect-ios-embedded-binaries.py "$APP" 2>&1 | tee rejected-ipa-audit.log
      - name: Preserve original IPA audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rejected-ipa-binary-audit
          path: rejected-ipa-audit.log
          if-no-files-found: error
